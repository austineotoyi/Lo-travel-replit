name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: lo-travel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        run: |
          pwd
          ls -la
          test -f package.json
          test -d android

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: lo-travel/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify Expo
        run: npx expo --version

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Verify Gradle wrapper
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties
          test -f android/gradle/wrapper/gradle-wrapper.jar

      - name: Build Debug APK
        working-directory: lo-travel/android
        run: ./gradlew assembleDebug --stacktrace

      - name: List APK
        if: always()
        run: |
          find lo-travel/android/app/build/outputs -name "*.apk" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel-debug-apk
          path: lo-travel/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
