name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: |
          # Purge node modules and ALL old lock files completely
          rm -rf node_modules
          rm -f package-lock.json
          rm -f yarn.lock
          rm -f .npmrc
          rm -f ~/.npmrc
          
          # Clean out global system proxy footprints entirely
          unset HTTP_PROXY
          unset HTTPS_PROXY
          unset http_proxy
          unset https_proxy
          
          # FIXED: Switch engine execution to Yarn to fully break away from npm's 403 configuration lock
          yarn config delete proxy || true
          yarn config delete https-proxy || true
          
          # Force clean install bypassing strict peer block dependencies
          yarn install --ignore-engines
          
          # Reconcile the Reanimated/Worklets ecosystem using Expo's validated dependency engine
          npx expo install react-native-reanimated react-native-worklets

      - name: Generate Android project (Expo)
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleDebug -PBUNDLE_IN_APP=true --continue --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
      - name: Reset npm registry
        run: |
          rm -f .npmrc
          rm -f ~/.npmrc
          npm config delete registry || true
          npm config set registry https://npmjs.org

      - name: Install dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          
          npm config delete proxy || true
          npm config delete https-proxy || true
          
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.publishConfig;
          delete pkg.resolutions;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          
          npm install --legacy-peer-deps --no-audit --no-fund --registry=https://npmjs.org
          npx expo install react-native-reanimated react-native-worklets -- --legacy-peer-deps --registry=https://npmjs.org

      - name: Generate Android project (Expo)
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with embedded JS bundle
        run: |
          cd android
          # FIXED: Added --continue to expose the exact compilation root error in your source code
          ./gradlew assembleDebug -PBUNDLE_IN_APP=true --continue --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
      - name: Reset npm registry
        run: |
          rm -f .npmrc
          rm -f ~/.npmrc
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          # Purge node modules and local locking profiles completely
          rm -rf node_modules
          rm -f package-lock.json
          
          # Clean out Replit configuration settings or custom overrides blocking network requests
          npm config delete proxy || true
          npm config delete https-proxy || true
          
          # FIXED: Use node to remove problematic private configuration values from package.json before running npm install
          node -e "
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          delete pkg.publishConfig;
          delete pkg.resolutions;
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
          "
          
          # Run installation directly via the global public registry endpoint
          npm install --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org/
          
          # Reconcile the Reanimated/Worklets ecosystem using Expo's validated dependency engine
          npx expo install react-native-reanimated react-native-worklets -- --legacy-peer-deps --registry=https://registry.npmjs.org/

      - name: Generate Android project (Expo)
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
