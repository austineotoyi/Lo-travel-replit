name: Build LO Travel Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LO Travel Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Node 24
      # ---------------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: artifacts/lo-travel/package-lock.json

      # ---------------------------------------------------------
      # 4. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 5. Install Android SDK components required by Expo SDK 54
      # ---------------------------------------------------------
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.1.12297006"

      # ---------------------------------------------------------
      # 6. Verify Node / npm
      # ---------------------------------------------------------
      - name: Verify environment
        run: |
          node --version
          npm --version
          npx expo --version

      # ---------------------------------------------------------
      # 7. Clean old native project
      #
      # IMPORTANT:
      # Android is generated by Expo Prebuild.
      # Do not rely on a stale committed android directory.
      # ---------------------------------------------------------
      - name: Remove generated Android project
        run: |
          rm -rf android
          rm -rf ios

      # ---------------------------------------------------------
      # 8. Install dependencies from the committed lock file
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund

      # ---------------------------------------------------------
      # 9. Verify Expo dependency compatibility
      # ---------------------------------------------------------
      - name: Verify Expo dependencies
        run: |
          npx expo install --check

      # ---------------------------------------------------------
      # 10. Generate fresh Android project
      #
      # --clean guarantees that no stale native configuration
      # survives from an old generated project.
      # ---------------------------------------------------------
      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive

      # ---------------------------------------------------------
      # 11. Run Expo Doctor AFTER prebuild
      #
      # This prevents the "native project folders + app.json"
      # warning caused by checking the project before CNG
      # regeneration.
      # ---------------------------------------------------------
      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      # ---------------------------------------------------------
      # 12. Verify New Architecture
      # ---------------------------------------------------------
      - name: Verify New Architecture
        run: |
          echo "Checking generated gradle.properties..."
          grep -n "newArchEnabled" android/gradle.properties || true

          if ! grep -q "^newArchEnabled=true" android/gradle.properties; then
            echo "ERROR: newArchEnabled=true was not generated."
            exit 1
          fi

      # ---------------------------------------------------------
      # 13. Make Gradle executable
      # ---------------------------------------------------------
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # ---------------------------------------------------------
      # 14. Build unsigned release APK
      #
      # Release builds embed the JavaScript bundle.
      # No Metro server is required on the test device.
      # ---------------------------------------------------------
      - name: Build unsigned release APK
        run: |
          cd android
          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # ---------------------------------------------------------
      # 15. Verify APK exists
      # ---------------------------------------------------------
      - name: Verify release APK
        run: |
          echo "Release APK files:"
          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" -print -quit)"

      # ---------------------------------------------------------
      # 16. Upload APK
      # ---------------------------------------------------------
      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel-release-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
