name: Build LO Travel Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LO Travel Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    steps:
      # ---------------------------------------------------------
      # 1. Checkout
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # 2. Java 17
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ---------------------------------------------------------
      # 3. Node 24
      # ---------------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # ---------------------------------------------------------
      # 4. Android SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ---------------------------------------------------------
      # 5. Verify project files
      # ---------------------------------------------------------
      - name: Verify project configuration
        run: |
          echo "Checking LO Travel project..."

          test -f package.json
          test -f app.json
          test -f babel.config.js

          echo "package.json found"
          echo "app.json found"
          echo "babel.config.js found"

          node - <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const app = JSON.parse(
            fs.readFileSync("app.json", "utf8")
          );

          console.log("Expo:", pkg.dependencies?.expo);
          console.log("React Native:", pkg.dependencies?.["react-native"]);
          console.log(
            "Reanimated:",
            pkg.dependencies?.["react-native-reanimated"]
          );
          console.log(
            "Worklets:",
            pkg.dependencies?.["react-native-worklets"]
          );
          console.log(
            "Babel Expo:",
            pkg.devDependencies?.["babel-preset-expo"]
          );
          console.log(
            "New Architecture:",
            app.expo?.newArchEnabled
          );

          if (!pkg.dependencies?.["react-native-worklets"]) {
            throw new Error(
              "react-native-worklets is missing from package.json"
            );
          }

          if (
            pkg.devDependencies?.["babel-preset-expo"] !== "~54.0.10"
          ) {
            throw new Error(
              "babel-preset-expo must be ~54.0.10"
            );
          }

          if (app.expo?.newArchEnabled !== true) {
            throw new Error(
              "newArchEnabled must be true in app.json"
            );
          }
          NODE

      # ---------------------------------------------------------
      # 6. Clean npm configuration
      # ---------------------------------------------------------
      - name: Clean npm configuration
        run: |
          rm -f .npmrc
          rm -f ~/.npmrc

          npm config delete registry || true
          npm config delete proxy || true
          npm config delete https-proxy || true

          npm config set registry https://registry.npmjs.org/

          npm config get registry

      # ---------------------------------------------------------
      # 7. Remove stale installation and lockfile
      # ---------------------------------------------------------
      - name: Remove stale dependencies
        run: |
          rm -rf node_modules
          rm -f package-lock.json
          rm -f yarn.lock

      # ---------------------------------------------------------
      # 8. Generate a NEW package-lock.json
      # ---------------------------------------------------------
      - name: Generate package-lock.json
        run: |
          npm install \
            --legacy-peer-deps \
            --package-lock-only \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            --registry=https://registry.npmjs.org/

      # ---------------------------------------------------------
      # 9. Install exactly from the newly generated lockfile
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          npm ci \
            --legacy-peer-deps \
            --no-audit \
            --no-fund

      # ---------------------------------------------------------
      # 10. Verify installed dependency versions
      # ---------------------------------------------------------
      - name: Verify installed dependencies
        run: |
          node - <<'NODE'
          const fs = require("fs");

          const pkg = JSON.parse(
            fs.readFileSync("package.json", "utf8")
          );

          const required = [
            "expo",
            "react",
            "react-native",
            "react-native-reanimated",
            "react-native-worklets"
          ];

          for (const name of required) {
            const version =
              pkg.dependencies?.[name] ||
              pkg.devDependencies?.[name];

            console.log(`${name}: ${version || "MISSING"}`);

            if (!version) {
              throw new Error(`${name} is missing`);
            }
          }
          NODE

          npm ls react-native-reanimated react-native-worklets --depth=0 || true

      # ---------------------------------------------------------
      # 11. Expo Doctor
      # ---------------------------------------------------------
      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      # ---------------------------------------------------------
      # 12. Remove any committed/generated Android project
      # ---------------------------------------------------------
      - name: Remove old Android project
        run: |
          rm -rf android

          if [ -d android ]; then
            echo "ERROR: android directory still exists"
            exit 1
          fi

      # ---------------------------------------------------------
      # 13. Generate fresh Android project
      # ---------------------------------------------------------
      - name: Generate Android project with Expo Prebuild
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive

      # ---------------------------------------------------------
      # 14. Verify generated Android configuration
      # ---------------------------------------------------------
      - name: Verify generated Android configuration
        run: |
          echo "Checking generated Android project..."

          test -f android/gradle.properties
          test -f android/gradlew

          echo "Checking New Architecture..."

          grep -q '^newArchEnabled=true$' android/gradle.properties || {
            echo "ERROR: newArchEnabled=true is missing"
            echo "Generated gradle.properties:"
            cat android/gradle.properties
            exit 1
          }

          echo "New Architecture is ENABLED."

          echo "Checking Hermes..."

          grep -q '^hermesEnabled=true$' android/gradle.properties || {
            echo "ERROR: hermesEnabled=true is missing"
            exit 1
          }

          echo "Hermes is ENABLED."

      # ---------------------------------------------------------
      # 15. Make Gradle executable
      # ---------------------------------------------------------
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # ---------------------------------------------------------
      # 16. Build release APK
      # ---------------------------------------------------------
      - name: Build LO Travel Release APK
        run: |
          cd android

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # ---------------------------------------------------------
      # 17. Verify APK
      # ---------------------------------------------------------
      - name: Verify Release APK
        run: |
          APK_DIR="android/app/build/outputs/apk/release"

          echo "Looking for APK..."

          find "$APK_DIR" -type f -name "*.apk" -print

          APK=$(find "$APK_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "========================================"
          echo "LO Travel APK successfully generated"
          echo "========================================"
          echo ""
          echo "APK:"
          echo "$APK"
          echo ""

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

      # ---------------------------------------------------------
      # 18. Upload APK
      # ---------------------------------------------------------
      - name: Upload LO Travel Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel-release-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
