name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LO Travel Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    env:
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:

      # --------------------------------------------------
      # CHECKOUT
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------
      # NODE
      # Expo SDK 54
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: artifacts/lo-travel/package-lock.json


      # --------------------------------------------------
      # JAVA
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # --------------------------------------------------
      # ANDROID
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # --------------------------------------------------
      # VERIFY FILES
      # --------------------------------------------------
      - name: Verify project files
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Files:"
          ls -la

          test -f package.json
          test -f package-lock.json
          test -f app.json
          test -f babel.config.js


      # --------------------------------------------------
      # NPM CONFIGURATION
      # --------------------------------------------------
      - name: Configure npm
        run: |
          rm -f .npmrc

          npm config delete proxy || true
          npm config delete https-proxy || true

          npm config set registry https://registry.npmjs.org/


      # --------------------------------------------------
      # INSTALL EXACT LOCKFILE
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund


      # --------------------------------------------------
      # VERIFY CRITICAL DEPENDENCIES
      # --------------------------------------------------
      - name: Verify Expo dependencies
        run: |
          echo "Expo:"
          npm ls expo --depth=0

          echo ""
          echo "React:"
          npm ls react --depth=0

          echo ""
          echo "React Native:"
          npm ls react-native --depth=0

          echo ""
          echo "Reanimated:"
          npm ls react-native-reanimated --depth=0

          echo ""
          echo "Worklets:"
          npm ls react-native-worklets --depth=0

          echo ""
          echo "Babel preset:"
          npm ls babel-preset-expo --depth=0


      # --------------------------------------------------
      # EXPO DOCTOR
      #
      # Do this BEFORE deleting/regenerating Android.
      # We only care about dependency compatibility here.
      # --------------------------------------------------
      - name: Run Expo Doctor
        run: |
          npx expo-doctor --verbose


      # --------------------------------------------------
      # VERIFY APP CONFIG
      # --------------------------------------------------
      - name: Verify New Architecture
        run: |
          node <<'NODE'
          const fs = require("fs");

          const file = "app.json";
          const app = JSON.parse(fs.readFileSync(file, "utf8"));

          if (!app.expo) {
            throw new Error("Missing expo configuration");
          }

          app.expo.newArchEnabled = true;

          fs.writeFileSync(
            file,
            JSON.stringify(app, null, 2) + "\n"
          );

          console.log(
            "newArchEnabled =",
            app.expo.newArchEnabled
          );
          NODE


      # --------------------------------------------------
      # GENERATE CLEAN ANDROID PROJECT
      # --------------------------------------------------
      - name: Generate Android project
        run: |
          rm -rf android

          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive


      # --------------------------------------------------
      # FORCE NEW ARCHITECTURE
      # --------------------------------------------------
      - name: Configure Gradle properties
        run: |
          if grep -q "^newArchEnabled=" android/gradle.properties; then
            sed -i \
              's/^newArchEnabled=.*/newArchEnabled=true/' \
              android/gradle.properties
          else
            echo "newArchEnabled=true" >> android/gradle.properties
          fi

          if grep -q "^hermesEnabled=" android/gradle.properties; then
            sed -i \
              's/^hermesEnabled=.*/hermesEnabled=true/' \
              android/gradle.properties
          else
            echo "hermesEnabled=true" >> android/gradle.properties
          fi

          echo ""
          echo "Final Gradle properties:"
          cat android/gradle.properties


      # --------------------------------------------------
      # VERIFY GENERATED PROJECT
      # --------------------------------------------------
      - name: Verify Android project
        run: |
          test -f android/gradlew
          test -f android/app/build.gradle
          test -f android/gradle.properties

          echo ""
          echo "Android project generated successfully."


      # --------------------------------------------------
      # GRADLE PERMISSION
      # --------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # --------------------------------------------------
      # ENVIRONMENT
      # --------------------------------------------------
      - name: Verify build environment
        run: |
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Expo:"
          npx expo --version

          echo ""
          echo "Gradle:"
          cd android
          ./gradlew --version


      # --------------------------------------------------
      # BUILD RELEASE APK
      # --------------------------------------------------
      - name: Build LO Travel Release APK
        run: |
          cd android

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            --no-parallel


      # --------------------------------------------------
      # VERIFY APK
      # --------------------------------------------------
      - name: Verify release APK
        run: |
          echo "Searching for APK..."

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: Release APK was not generated."
            exit 1
          fi

          echo ""
          echo "Release APK generated successfully."


      # --------------------------------------------------
      # UPLOAD APK
      # --------------------------------------------------
      - name: Upload LO Travel Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel-release-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30


      # --------------------------------------------------
      # DIAGNOSTICS IF BUILD FAILS
      # --------------------------------------------------
      - name: Collect diagnostics
        if: failure()
        run: |
          echo "========================================"
          echo "LO TRAVEL BUILD DIAGNOSTICS"
          echo "========================================"

          echo ""
          echo "Node:"
          node --version || true

          echo ""
          echo "Expo:"
          npx expo --version || true

          echo ""
          echo "React Native:"
          npm ls react-native --depth=0 || true

          echo ""
          echo "Reanimated:"
          npm ls react-native-reanimated --depth=0 || true

          echo ""
          echo "Worklets:"
          npm ls react-native-worklets --depth=0 || true

          echo ""
          echo "Babel:"
          npm ls babel-preset-expo --depth=0 || true

          echo ""
          echo "Gradle properties:"
          cat android/gradle.properties || true

          echo ""
          echo "========================================"
