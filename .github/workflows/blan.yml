name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Reset npm registry
        run: |
          rm -f .npmrc
          rm -f ~/.npmrc
          npm config delete registry || true
          npm config set registry https://registry.npmjs.org/

      - name: Install dependencies
        run: |
          # FIXED: Purging package-lock.json to avoid the 403 fetching state locks
          rm -rf node_modules
          rm -f package-lock.json
          
          # Run a fresh installation generating clean network hashes
          npm install --legacy-peer-deps

      - name: Generate Android project (Expo)
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleDebug -PBUNDLE_IN_APP=true --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Reset npm registry
        run: |
          # Completely purge local configs to prevent downstream 403 blocks
          rm -f .npmrc
          rm -f ~/.npmrc
          npm config delete registry || true
          npm config set registry https://npmjs.org

      - name: Install dependencies
        run: |
          rm -rf node_modules
          # FIXED: Added --legacy-peer-deps to handle mismatched react-compiler peer versions gracefully
          npm install --legacy-peer-deps

      - name: Generate Android project (Expo)
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleDebug -PBUNDLE_IN_APP=true --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Reset npm registry
        run: |
          npm config delete registry || true
          npm config set registry https://npmjs.org
          rm -f .npmrc

      - name: Install dependencies
        run: |
          rm -rf node_modules
          npm install

      - name: Generate Android project (Expo)
        run: |
          npx expo prebuild --platform android --non-interactive

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK with embedded JS bundle
        run: |
          cd android
          ./gradlew assembleDebug -PBUNDLE_IN_APP=true --stacktrace --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
