name: Build LO Travel Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: lo-travel-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build LO Travel Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # --------------------------------------------------
      # 3. Node 24
      # --------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # --------------------------------------------------
      # 4. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # --------------------------------------------------
      # 5. Install Android SDK components
      # --------------------------------------------------
      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          sdkmanager "ndk;27.1.12297006"

      # --------------------------------------------------
      # 6. Verify environment
      # --------------------------------------------------
      - name: Verify environment
        run: |
          node --version
          npm --version
          npx expo --version

      # --------------------------------------------------
      # 7. Remove old generated native projects
      # --------------------------------------------------
      - name: Remove old Android project
        run: |
          rm -rf android
          rm -rf ios

      # --------------------------------------------------
      # 8. Clean npm environment
      # --------------------------------------------------
      - name: Clean npm configuration
        run: |
          rm -f .npmrc
          rm -f ~/.npmrc

          npm config delete proxy || true
          npm config delete https-proxy || true

          npm config set registry https://registry.npmjs.org/

      # --------------------------------------------------
      # 9. Install dependencies
      #
      # IMPORTANT:
      # Use npm install instead of npm ci while stabilizing
      # the Expo/RN dependency tree.
      # --------------------------------------------------
      - name: Install dependencies
        run: |
          rm -rf node_modules

          npm install \
            --legacy-peer-deps \
            --no-audit \
            --no-fund \
            --registry=https://registry.npmjs.org/

      # --------------------------------------------------
      # 10. Verify critical dependency versions
      # --------------------------------------------------
      - name: Verify React Native dependencies
        run: |
          npm ls react-native --depth=0
          npm ls react-native-reanimated --depth=0
          npm ls react-native-worklets --depth=0
          npm ls expo --depth=0

      # --------------------------------------------------
      # 11. Verify Expo dependencies
      # --------------------------------------------------
      - name: Check Expo dependencies
        run: |
          npx expo install --check

      # --------------------------------------------------
      # 12. Generate fresh Android project
      # --------------------------------------------------
      - name: Generate Android project
        run: |
          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive

      # --------------------------------------------------
      # 13. Force New Architecture in generated project
      # --------------------------------------------------
      - name: Verify and enforce New Architecture
        run: |
          if grep -q "^newArchEnabled=" android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=true/' android/gradle.properties
          else
            echo "newArchEnabled=true" >> android/gradle.properties
          fi

          echo "Generated gradle.properties:"
          cat android/gradle.properties

          grep -q "^newArchEnabled=true" android/gradle.properties

      # --------------------------------------------------
      # 14. Run Expo Doctor AFTER prebuild
      # --------------------------------------------------
      - name: Run Expo Doctor
        run: |
          npx expo-doctor

      # --------------------------------------------------
      # 15. Make Gradle executable
      # --------------------------------------------------
      - name: Make Gradle executable
        run: |
          chmod +x android/gradlew

      # --------------------------------------------------
      # 16. Build RELEASE APK
      #
      # assembleRelease embeds the JS bundle into the APK.
      # Metro is NOT required on the testing device.
      # --------------------------------------------------
      - name: Build release APK
        run: |
          cd android

          ./gradlew assembleRelease \
            --stacktrace \
            --no-daemon \
            --warning-mode all

      # --------------------------------------------------
      # 17. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        run: |
          echo "Searching for release APK..."

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No release APK was generated."
            exit 1
          fi

          echo "Found $APK_COUNT release APK(s)."

      # --------------------------------------------------
      # 18. Upload APK
      # --------------------------------------------------
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel-release-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
