name: Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LO Travel Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    defaults:
      run:
        working-directory: artifacts/lo-travel

    env:
      NODE_VERSION: "20.19.0"
      EXPO_NO_TELEMETRY: "1"
      CI: "1"

    steps:

      # ---------------------------------------------------------
      # 1. CHECKOUT
      # ---------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ---------------------------------------------------------
      # 2. NODE.JS
      # Expo SDK 54 requires Node 20.19.x or newer.
      # ---------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: artifacts/lo-travel/package-lock.json


      # ---------------------------------------------------------
      # 3. JAVA
      # ---------------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ---------------------------------------------------------
      # 4. ANDROID SDK
      # ---------------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ---------------------------------------------------------
      # 5. VERIFY PROJECT
      # ---------------------------------------------------------
      - name: Verify project structure
        run: |
          echo "Working directory:"
          pwd

          echo ""
          echo "Project files:"
          ls -la

          echo ""
          echo "package.json:"
          test -f package.json

          echo ""
          echo "package-lock.json:"
          test -f package-lock.json

          echo ""
          echo "app.json:"
          test -f app.json


      # ---------------------------------------------------------
      # 6. CLEAN NPM CONFIGURATION
      # Do NOT delete package-lock.json.
      # ---------------------------------------------------------
      - name: Configure npm
        run: |
          rm -f .npmrc

          npm config delete proxy || true
          npm config delete https-proxy || true

          npm config set registry https://registry.npmjs.org/


      # ---------------------------------------------------------
      # 7. INSTALL EXACT LOCKFILE DEPENDENCIES
      # ---------------------------------------------------------
      - name: Install dependencies
        run: |
          rm -rf node_modules

          npm ci --legacy-peer-deps --no-audit --no-fund


      # ---------------------------------------------------------
      # 8. ENFORCE EXPO SDK 54 COMPATIBLE REANIMATED STACK
      #
      # Expo SDK 54:
      # react-native-reanimated ~4.1.1
      # react-native-worklets 0.5.1
      # ---------------------------------------------------------
      - name: Verify Reanimated and Worklets versions
        run: |
          echo "Installed Expo:"
          npx expo --version

          echo ""
          echo "Installed React:"
          npm ls react --depth=0 || true

          echo ""
          echo "Installed React Native:"
          npm ls react-native --depth=0 || true

          echo ""
          echo "Installed Reanimated:"
          npm ls react-native-reanimated --depth=0 || true

          echo ""
          echo "Installed Worklets:"
          npm ls react-native-worklets --depth=0 || true


      # ---------------------------------------------------------
      # 9. VERIFY EXPO DEPENDENCY HEALTH
      # ---------------------------------------------------------
      - name: Run Expo Doctor
        run: |
          npx expo-doctor


      # ---------------------------------------------------------
      # 10. VERIFY NEW ARCHITECTURE
      # ---------------------------------------------------------
      - name: Verify New Architecture configuration
        run: |
          echo "Checking app.json..."

          node <<'NODE'
          const fs = require("fs");

          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));

          app.expo = app.expo || {};

          if (app.expo.newArchEnabled !== true) {
            console.log("newArchEnabled was not explicitly true.");
            console.log("Forcing it to true for this CI build.");

            app.expo.newArchEnabled = true;

            fs.writeFileSync(
              "app.json",
              JSON.stringify(app, null, 2) + "\n"
            );
          }

          console.log(
            "newArchEnabled:",
            app.expo.newArchEnabled
          );
          NODE


      # ---------------------------------------------------------
      # 11. ENSURE CORRECT REANIMATED VERSIONS
      # ---------------------------------------------------------
      - name: Align Reanimated with Expo SDK 54
        run: |
          npx expo install \
            react-native-reanimated@~4.1.1 \
            react-native-worklets@0.5.1

          echo ""
          echo "Final dependency versions:"
          npm ls react-native-reanimated react-native-worklets --depth=0 || true


      # ---------------------------------------------------------
      # 12. CLEAN OLD ANDROID PROJECT
      #
      # Android is generated from app.json/package.json.
      # ---------------------------------------------------------
      - name: Generate Android project
        run: |
          rm -rf android

          npx expo prebuild \
            --platform android \
            --clean \
            --non-interactive


      # ---------------------------------------------------------
      # 13. FORCE NEW ARCHITECTURE IN GENERATED GRADLE
      # ---------------------------------------------------------
      - name: Configure Android Gradle properties
        run: |
          test -f android/gradle.properties

          if grep -q "^newArchEnabled=" android/gradle.properties; then
            sed -i 's/^newArchEnabled=.*/newArchEnabled=true/' android/gradle.properties
          else
            echo "newArchEnabled=true" >> android/gradle.properties
          fi

          if grep -q "^hermesEnabled=" android/gradle.properties; then
            sed -i 's/^hermesEnabled=.*/hermesEnabled=true/' android/gradle.properties
          else
            echo "hermesEnabled=true" >> android/gradle.properties
          fi

          echo ""
          echo "Final android/gradle.properties:"
          cat android/gradle.properties


      # ---------------------------------------------------------
      # 14. VERIFY GENERATED PROJECT
      # ---------------------------------------------------------
      - name: Verify generated Android project
        run: |
          test -f android/gradlew
          test -f android/gradle.properties
          test -f android/app/build.gradle

          echo ""
          echo "Generated Android project:"
          ls -la android

          echo ""
          echo "Gradle wrapper:"
          ls -la android/gradlew


      # ---------------------------------------------------------
      # 15. MAKE GRADLE EXECUTABLE
      # ---------------------------------------------------------
      - name: Make Gradle executable
        run: chmod +x android/gradlew


      # ---------------------------------------------------------
      # 16. VERIFY NODE / JAVA / GRADLE ENVIRONMENT
      # ---------------------------------------------------------
      - name: Verify build environment
        run: |
          echo "Node:"
          node --version

          echo ""
          echo "npm:"
          npm --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          cd android
          ./gradlew --version


      # ---------------------------------------------------------
      # 17. BUILD RELEASE APK
      #
      # assembleRelease automatically bundles JS for a release build.
      # No Metro server is required on the user's phone.
      # ---------------------------------------------------------
      - name: Build LO Travel Release APK
        run: |
          cd android

          ./gradlew \
            assembleRelease \
            --stacktrace \
            --no-daemon \
            --no-parallel


      # ---------------------------------------------------------
      # 18. VERIFY APK
      # ---------------------------------------------------------
      - name: Verify APK
        run: |
          echo "Release APK files:"

          find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find android/app/build/outputs/apk/release \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No release APK was generated."
            exit 1
          fi

          echo ""
          echo "APK successfully generated."


      # ---------------------------------------------------------
      # 19. UPLOAD RELEASE APK
      # ---------------------------------------------------------
      - name: Upload LO Travel Release APK
        uses: actions/upload-artifact@v4
        with:
          name: lo-travel-release-apk
          path: artifacts/lo-travel/android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30


      # ---------------------------------------------------------
      # 20. FAILURE DIAGNOSTICS
      # ---------------------------------------------------------
      - name: Collect build diagnostics
        if: failure()
        run: |
          echo "================================================"
          echo "BUILD DIAGNOSTICS"
          echo "================================================"

          echo ""
          echo "Node:"
          node --version || true

          echo ""
          echo "npm:"
          npm --version || true

          echo ""
          echo "Expo:"
          npx expo --version || true

          echo ""
          echo "React Native:"
          npm ls react-native --depth=0 || true

          echo ""
          echo "Reanimated:"
          npm ls react-native-reanimated --depth=0 || true

          echo ""
          echo "Worklets:"
          npm ls react-native-worklets --depth=0 || true

          echo ""
          echo "gradle.properties:"
          cat android/gradle.properties || true

          echo ""
          echo "Reanimated package:"
          cat node_modules/react-native-reanimated/package.json || true

          echo ""
          echo "Worklets package:"
          cat node_modules/react-native-worklets/package.json || true

          echo ""
          echo "================================================"
          echo "END DIAGNOSTICS"
          echo "================================================"
