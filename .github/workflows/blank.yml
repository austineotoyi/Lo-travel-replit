name: Auto Unzip Archive

on:
  push:
    paths:
      - '**.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP archives
        run: |
          shopt -s nullglob

          for zip in *.zip; do
            echo "Extracting $zip..."
            unzip -oq "$zip" -d .
            rm -f "$zip"
          done

      - name: Commit extracted files
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add .

          # Prevent GitHub from rejecting workflow updates
          git restore --staged .github/workflows/*.yml 2>/dev/null || true
          git restore --staged .github/workflows/*.yaml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automatically unzipped archive"
          fi

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref_name }}
