name: Auto Unzip Android Package

on:
  push:
    paths:
      - "**/android-build-package.zip"
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Android Build Package
        run: |
          find . -type f -name "android-build-package.zip" | while read -r zip; do
            target_dir=$(dirname "$zip")

            echo "Extracting $zip into $target_dir..."
            
            # The -x flag explicitly excludes internal workflow paths to prevent permission rejection
            unzip -o "$zip" -d "$target_dir" -x "*.github/workflows/*"

            echo "Removing $zip..."
            rm -f "$zip"
          done

      - name: Fix extracted file permissions
        run: |
          echo "Fixing workspace permissions..."
          find . -type d -not -path '*/.*' -exec chmod 755 {} \;
          find . -type f -not -path '*/.*' -exec chmod 644 {} \;
          find . -name "gradlew" -exec chmod +x {} \;

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Automatically extracted android-build-package.zip [skip ci]"
          git push
          
